{% extends "base.html" %}

{% block content %}
<div class="kd-auth-wrap">
  <div class="kd-auth-card">
    <div class="kd-auth-head">
      <h1 class="kd-auth-title">Sign in</h1>
      <p class="kd-auth-subtitle">Access your workspaces and knowledge base.</p>
    </div>

    {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}
    {% if registered %}
    <div class="alert alert-success" role="alert">Account created. Sign in below.</div>
    {% endif %}

    <form method="post" action="/ui/login" novalidate>
      <div class="kd-form-group">
        <label class="kd-form-label" for="email">Email</label>
        <input
          class="kd-form-control"
          type="email"
          id="email"
          name="email"
          value="{{ email or '' }}"
          autocomplete="email"
          required
          autofocus
        />
      </div>

      <div class="kd-form-group">
        <label class="kd-form-label" for="password">Password</label>
        <input
          class="kd-form-control"
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        />
      </div>

      <button class="kd-btn kd-btn-primary w-100" type="submit">Sign in</button>
    </form>

    <p class="kd-auth-alt">
      No account? <a href="/register">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
